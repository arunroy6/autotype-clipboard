<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />
  <!-- Clipboard Body -->
  <rect x="20" y="18" width="24" height="30" rx="3" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="2" />
  <!-- Clipboard Clip -->
  <path d="M27 18v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2" fill="#FFFFFF" />
  <!-- Lightning Bolt (signifying speed/auto) -->
  <path d="M33 24l-5 6h4l-1 8 6-7h-4z" fill="#00F5FF" filter="url(#glow)" />
</svg>
